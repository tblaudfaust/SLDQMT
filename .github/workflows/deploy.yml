# Deploys to the Hostinger VPS after every push to main, once the Checks workflow passes.
# Repository secrets needed: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key text), optional VPS_PORT (default 22).
name: Deploy to VPS
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy/update.sh on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/sldqmt
            bash deploy/update.sh
