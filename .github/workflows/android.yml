# Builds the tablet APK on every change under android/ and publishes it as a workflow artifact.
# Repository variable API_BASE_URL (for example https://dqm.example.sl/api/v1/) tells the APK where the server is.
# Optional secrets for a real signing key: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. Without them the release APK is signed with the debug key, which still installs on tablets.
# Pushing a tag such as v0.2.0 also attaches the APK to a GitHub Release.
name: Android APK
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Create a debug keystore (fresh runners have none; used when no release key is configured)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          for dir in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$dir"
            [ -f "$dir/debug.keystore" ] || keytool -genkeypair -keystore "$dir/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          done
      - name: Build release APK and run unit tests
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease testDebugUnitTest
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "SLPHC-FieldMonitor-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SLPHC-FieldMonitor-apk
          path: android/SLPHC-FieldMonitor-*.apk
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/SLPHC-FieldMonitor-*.apk
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
